<!DOCTYPE html>
<html>
<head>
  <title>SVG Art</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .art { display: inline-block; margin: 10px; }
    svg { border: 3px solid #FF8B82; }
  </style>
</head>
<body>

  
  <div class="art">
    <svg width="200" height="300">
      <circle cx="50" cy="50" r="30" fill="#FF8B82" />
      <circle cx="45" cy="50" r="15" fill="#00B4A6" />
      <circle cx="140" cy="90" r="35" fill="#FF8B82" />
      <circle cx="145" cy="95" r="18" fill="#00B4A6" />
      <circle cx="60" cy="210" r="30" fill="#FF8B82" />
      <circle cx="55" cy="210" r="15" fill="#00B4A6" />
      <circle cx="130" cy="240" r="35" fill="#FF8B82" />
      <circle cx="135" cy="240" r="18" fill="#00B4A6" />

      <line x1="20" y1="100" x2="120" y2="100" stroke="#FF8B82" stroke-width="3" />
      <line x1="50" y1="80" x2="50" y2="140" stroke="#FF8B82" stroke-width="3" />
      <line x1="80" y1="170" x2="180" y2="170" stroke="#FF8B82" stroke-width="3" />
      <line x1="150" y1="125" x2="150" y2="200" stroke="#FF8B82" stroke-width="3" />
    </svg>
    <p>1. Line and Circle</p>
  </div>

 
  <div class="art">
    <svg width="200" height="300">
      <rect x="0" y="0" width="200" height="300" fill="#FF8B82" />
      
      <rect x="10" y="15" width="180" height="75" fill="#00B4A6" />
      <circle cx="45" cy="52" r="15" fill="#FF8B82" />
      <circle cx="100" cy="52" r="15" fill="#FF8B82" />
      <circle cx="155" cy="52" r="15" fill="#FF8B82" />

      <rect x="10" y="110" width="180" height="75" fill="#00B4A6" />
      <circle cx="45" cy="147" r="15" fill="#FF8B82" />
      <circle cx="100" cy="147" r="15" fill="#FF8B82" />
      <circle cx="155" cy="147" r="15" fill="#FF8B82" />

      <rect x="10" y="205" width="180" height="75" fill="#00B4A6" />
      <circle cx="45" cy="242" r="15" fill="#FF8B82" />
      <circle cx="100" cy="242" r="15" fill="#FF8B82" />
      <circle cx="155" cy="242" r="15" fill="#FF8B82" />
    </svg>
    <p>2. Circle and Rectangle</p>
  </div>

  
  <div class="art">
    <svg width="200" height="300">
      <polyline points="0,40 50,10 100,40 150,10 200,40" fill="none" stroke="#FF8B82" stroke-width="15" />
      <polyline points="0,65 50,35 100,65 150,35 200,65" fill="none" stroke="#00B4A6" stroke-width="15" />

      <circle cx="50" cy="95" r="12" fill="#B8ABA6" />
      <circle cx="100" cy="95" r="12" fill="#B8ABA6" />
      <circle cx="150" cy="95" r="12" fill="#B8ABA6" />

      <polyline points="0,150 50,120 100,150 150,120 200,150" fill="none" stroke="#FFD12A" stroke-width="15" />
      <polyline points="0,175 50,145 100,175 150,145 200,175" fill="none" stroke="#FF2A2A" stroke-width="15" />

      <circle cx="50" cy="205" r="12" fill="#B8ABA6" />
      <circle cx="100" cy="205" r="12" fill="#B8ABA6" />
      <circle cx="150" cy="205" r="12" fill="#B8ABA6" />

      <polyline points="0,260 50,230 100,260 150,230 200,260" fill="none" stroke="#7D6257" stroke-width="15" />
      <polyline points="0,285 50,255 100,285 150,255 200,285" fill="none" stroke="#00B4A6" stroke-width="15" />
    </svg>
    <p>3. Polyline and Circle</p>
  </div>

  
  <div class="art">
    <svg width="200" height="300">
      <polygon points="0,30 50,0 100,30 150,0 200,30 200,50 150,20 100,50 50,20 0,50" fill="#FF8B82" />
      <polygon points="0,55 50,25 100,55 150,25 200,55 200,75 150,45 100,75 50,45 0,75" fill="#00B4A6" />

      <ellipse cx="45" cy="150" rx="20" ry="35" fill="#B8ABA6" />
      <ellipse cx="100" cy="150" rx="20" ry="35" fill="#B8ABA6" />
      <ellipse cx="155" cy="150" rx="20" ry="35" fill="#B8ABA6" />

      <polygon points="0,230 50,200 100,230 150,200 200,230 200,250 150,220 100,250 50,220 0,250" fill="#FFD12A" />
      <polygon points="0,255 50,225 100,255 150,225 200,255 200,275 150,245 100,275 50,245 0,275" fill="#FF2A2A" />
    </svg>
    <p>4. Polygon and Ellipse</p>
  </div>


  <div class="art">
    <svg width="200" height="300">
      <rect x="0" y="0" width="200" height="300" fill="#FF8B82" />

      <line x1="45" y1="20" x2="45" y2="280" stroke="#00B4A6" stroke-width="4" />
      <line x1="100" y1="20" x2="100" y2="280" stroke="#00B4A6" stroke-width="4" />
      <line x1="155" y1="20" x2="155" y2="280" stroke="#00B4A6" stroke-width="4" />

      <rect x="10" y="20" width="180" height="50" fill="#00B4A6" />
      <circle cx="45" cy="45" r="12" fill="#FF8B82" />
      <circle cx="100" cy="45" r="12" fill="#FF8B82" />
      <circle cx="155" cy="45" r="12" fill="#FF8B82" />

      <rect x="10" y="125" width="180" height="50" fill="#00B4A6" />
      <circle cx="45" cy="150" r="12" fill="#FF8B82" />
      <circle cx="100" cy="150" r="12" fill="#FF8B82" />
      <circle cx="155" cy="150" r="12" fill="#FF8B82" />

      <rect x="10" y="230" width="180" height="50" fill="#00B4A6" />
      <circle cx="45" cy="255" r="12" fill="#FF8B82" />
      <circle cx="100" cy="255" r="12" fill="#FF8B82" />
      <circle cx="155" cy="255" r="12" fill="#FF8B82" />
    </svg>
    <p>5. Circle, Line and Rectangle</p>
  </div>

  
  <div class="art">
    <svg width="200" height="300">
      <polyline points="30,0 60,50 30,100 60,150 30,200 60,250 30,300" fill="none" stroke="#00B4A6" stroke-width="15" />
      <polyline points="60,0 90,50 60,100 90,150 60,200 90,250 60,300" fill="none" stroke="#FF8B82" stroke-width="15" />
      <polyline points="110,0 140,50 110,100 140,150 110,200 140,250 110,300" fill="none" stroke="#00B4A6" stroke-width="15" />
      <polyline points="140,0 170,50 140,100 170,150 140,200 170,250 140,300" fill="none" stroke="#FF8B82" stroke-width="15" />

      <polygon points="100,25 145,50 145,100 100,125 55,100 55,50" fill="#FF8B82" />
      <polygon points="100,175 145,200 145,250 100,275 55,250 55,200" fill="#00B4A6" />
    </svg>
    <p>6. Polyline and Polygon</p>
  </div>

  
  <div class="art">

      <rect x="0" y="0" width="100" height="300" fill="#00B4A6" />
